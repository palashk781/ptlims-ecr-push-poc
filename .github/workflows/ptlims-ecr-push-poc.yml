name: PT-LIMS ECR Push POC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "poc/ecr-push/**"
      - ".github/workflows/ptlims-ecr-push-poc.yml"

permissions:
  contents: read

concurrency:
  group: ptlims-ecr-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push test image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPECTED_AWS_ACCOUNT_ID: "597088039162"
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: pk/ptlexternal
      LOCAL_IMAGE: ptlims-ecr-push-poc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate required GitHub secrets
        shell: bash
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$ACCESS_KEY" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is not configured in GitHub Secrets."
            exit 1
          fi

          if [[ -z "$SECRET_KEY" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "Required AWS credentials are configured."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
          force-skip-oidc: true

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ "$ACTUAL_ACCOUNT_ID" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::AWS account mismatch."
            echo "::error::Expected account: $EXPECTED_AWS_ACCOUNT_ID"
            echo "::error::Actual account: $ACTUAL_ACCOUNT_ID"
            exit 1
          fi

          echo "Successfully authenticated to AWS account $ACTUAL_ACCOUNT_ID."

      - name: Verify ECR repository
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text

      - name: Build POC image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file poc/ecr-push/Dockerfile \
            --tag "${LOCAL_IMAGE}:${GITHUB_SHA}" \
            poc/ecr-push

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Tag and push image
        id: publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_TAG="poc-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Tagging image as ${IMAGE_URI}"

          docker tag \
            "${LOCAL_IMAGE}:${GITHUB_SHA}" \
            "$IMAGE_URI"

          echo "Pushing image to Amazon ECR"

          docker push "$IMAGE_URI"

          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Unable to retrieve the pushed image digest."
            exit 1
          fi

          DIGEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$IMAGE_URI"
            echo "image_digest=$IMAGE_DIGEST"
            echo "digest_uri=$DIGEST_URI"
          } >> "$GITHUB_OUTPUT"

          echo "Image successfully pushed: $DIGEST_URI"

      - name: Publish result summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### PT-LIMS ECR push succeeded"
            echo
            echo "- GitHub repository: \`${GITHUB_REPOSITORY}\`"
            echo "- AWS account: \`${EXPECTED_AWS_ACCOUNT_ID}\`"
            echo "- AWS region: \`${AWS_REGION}\`"
            echo "- ECR repository: \`${ECR_REPOSITORY}\`"
            echo "- Image tag: \`${{ steps.publish.outputs.image_tag }}\`"
            echo "- Image URI: \`${{ steps.publish.outputs.image_uri }}\`"
            echo "- Image digest: \`${{ steps.publish.outputs.image_digest }}\`"
            echo "- Digest URI: \`${{ steps.publish.outputs.digest_uri }}\`"
          } >> "$GITHUB_STEP_SUMMARY"